name: checks
on: [push, pull_request]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev xvfb
      - run: cargo xtask ci
      - run: xvfb-run -a cargo run --locked -p datacraft-desktop -- examples/pipelines/sample.dcraft --smoke-frames 3
      - run: cargo run --locked -p datacraft-cli -- nodes --json
      - run: cargo run --locked -p datacraft-cli -- commands --json

  spark:
    runs-on: ubuntu-latest
    env:
      DATACRAFT_HDFS_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: sbt/setup-sbt@v1
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: docker compose -p datacraft-hdfs-ci -f examples/hdfs/docker-compose.yml up -d
      - name: Wait for real HDFS
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent 'http://localhost:9870/jmx?qry=Hadoop:service=NameNode,name=NameNodeInfo' | python3 -c 'import json,sys; s=json.load(sys.stdin)["beans"][0]; sys.exit(0 if json.loads(s["LiveNodes"]) and not s["Safemode"] else 1)'; then
              exit 0
            fi
            sleep 2
          done
          docker compose -p datacraft-hdfs-ci -f examples/hdfs/docker-compose.yml logs
          exit 1
      - run: sbt test writeClasspath
        working-directory: workers/spark
      - run: cargo run --locked -p datacraft-cli -- validate examples/pipelines/sample.dcraft
      - run: cargo run --locked -p datacraft-cli -- validate examples/pipelines/draft.dcraft --draft
      - run: cargo xtask fixtures
      - run: cargo test --locked -p datacraft-desktop --features spark-integration-tests run_button -- --test-threads=1
      - run: cargo test --locked -p datacraft-desktop --features hdfs-integration-tests hdfs_run_button -- --test-threads=1
      - run: cargo run --locked -p datacraft-cli -- inspect examples/data/sales.csv
      - run: cargo run --locked -p datacraft-engine --example job_lifecycle -- examples/pipelines/sample.dcraft
      - run: cargo run --locked -p datacraft-engine --example node_lifecycle
      - run: cargo run --locked -p datacraft-engine --example hdfs_lifecycle
      - name: Stop disposable HDFS
        if: always()
        run: docker compose -p datacraft-hdfs-ci -f examples/hdfs/docker-compose.yml down
