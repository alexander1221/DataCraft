name: checks
on: [push, pull_request]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: sbt/setup-sbt@v1
      - uses: dtolnay/rust-toolchain@stable
      - run: sbt test writeClasspath
        working-directory: workers/spark
      - run: cargo run --locked -p datacraft-cli -- validate examples/pipelines/sample.dcraft
      - run: cargo run --locked -p datacraft-cli -- run examples/pipelines/sample.dcraft
      - run: cargo run --locked -p datacraft-cli -- run examples/pipelines/regression.dcraft
      - run: cargo run --locked -p datacraft-cli -- run examples/pipelines/prediction.dcraft
      - run: cargo run --locked -p datacraft-cli -- inspect examples/data/sales.csv
