[package]
name = "datacraft-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.datacraft]
layer = "ui"

[features]
# Explicit acceptance test requiring the locally built JVM worker.
spark-integration-tests = []

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "=0.18.0"
clap = { version = "4", features = ["derive", "env"] }
datacraft-core.workspace = true
datacraft-engine.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "datacraft-desktop"
path = "src/main.rs"
