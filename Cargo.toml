[workspace]
members = ["crates/datacraft-core", "crates/datacraft-project", "crates/datacraft-engine", "apps/datacraft-cli", "apps/datacraft-desktop", "xtask"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
datacraft-core = { path = "crates/datacraft-core" }
datacraft-project = { path = "crates/datacraft-project" }
datacraft-engine = { path = "crates/datacraft-engine" }
